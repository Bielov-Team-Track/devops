#!/usr/sbin/nft -f
# Spike application server firewall. Docker manages its own tables
# (docker-bridges) — NEVER use `flush ruleset`, it would wipe them.
#
# Exactly one non-Docker base chain per hook. The forward chain is
# deliberately empty with policy accept: Docker's docker-bridges table
# carries its own isolation. A second forward chain with policy drop is
# what blackholed every Prometheus scrape on the old server for 17 days.

table inet volleyspike
delete table inet volleyspike

table inet volleyspike {
    set cloudflare_v4 {
        type ipv4_addr
        flags interval
        elements = {
            173.245.48.0/20, 103.21.244.0/22, 103.22.200.0/22,
            103.31.4.0/22, 141.101.64.0/18, 108.162.192.0/18,
            190.93.240.0/20, 188.114.96.0/20, 197.234.240.0/22,
            198.41.128.0/17, 162.158.0.0/15, 104.16.0.0/13,
            104.24.0.0/14, 172.64.0.0/13, 131.0.72.0/22
        }
    }

    set cloudflare_v6 {
        type ipv6_addr
        flags interval
        elements = {
            2400:cb00::/32, 2606:4700::/32, 2803:f800::/32,
            2405:b500::/32, 2405:8100::/32, 2a06:98c0::/29,
            2c0f:f248::/32
        }
    }

    chain input {
        type filter hook input priority 0; policy drop;

        iif lo accept
        ct state established,related accept

        tcp dport 22 accept

        ip  saddr @cloudflare_v4 tcp dport { 80, 443 } accept
        ip6 saddr @cloudflare_v6 tcp dport { 80, 443 } accept

        ip saddr 89.116.27.21 udp dport 51820 accept
        iifname "wg0" accept

        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept        # mandatory: NDP, or v6 breaks

        ct state invalid drop
    }

    chain forward {
        type filter hook forward priority 0; policy accept;
    }
}
