#!/usr/sbin/nft -f
# Spike application server firewall. Docker manages its own tables
# (docker-bridges) — NEVER use `flush ruleset`, it would wipe them.
#
# Exactly one non-Docker base chain per hook. The forward chain is
# deliberately empty with policy accept: Docker's docker-bridges table
# carries its own isolation. A second forward chain with policy drop is
# what blackholed every Prometheus scrape on the old server for 17 days.
#
# Reload with `nft -f /etc/nftables.conf` (the nftables unit's own
# ExecReload) — NEVER `systemctl restart nftables`. Its ExecStop runs
# `nft flush ruleset`, which wipes EVERY table, including Docker's
# `ip docker-bridges`: all container networking dies until dockerd restarts.
#
# Re-applying this file resets both Cloudflare sets below to the static
# in-file list, silently undoing refresh-cloudflare-nft.sh's work until its
# next scheduled run (up to ~25h with the timer's RandomizedDelaySec).

table inet volleyspike
delete table inet volleyspike

table inet volleyspike {
    set cloudflare_v4 {
        type ipv4_addr
        flags interval
        elements = {
            173.245.48.0/20, 103.21.244.0/22, 103.22.200.0/22,
            103.31.4.0/22, 141.101.64.0/18, 108.162.192.0/18,
            190.93.240.0/20, 188.114.96.0/20, 197.234.240.0/22,
            198.41.128.0/17, 162.158.0.0/15, 104.16.0.0/13,
            104.24.0.0/14, 172.64.0.0/13, 131.0.72.0/22
        }
    }

    set cloudflare_v6 {
        type ipv6_addr
        flags interval
        elements = {
            2400:cb00::/32, 2606:4700::/32, 2803:f800::/32,
            2405:b500::/32, 2405:8100::/32, 2a06:98c0::/29,
            2c0f:f248::/32
        }
    }

    chain input {
        type filter hook input priority 0; policy drop;

        iif lo accept
        ct state established,related accept

        tcp dport 22 accept

        # These two rules gate only HOST-PROCESS listeners on 80/443 — there
        # are none today. Caddy runs as a container with published ports, so
        # that traffic is DNAT'd in prerouting and hits the forward hook, not
        # input; it never reaches this chain. Web ingress on 80/443 is
        # therefore ungated by address right now, by design: the forward
        # chain stays empty (see the header comment) rather than gaining a
        # Cloudflare-only rule there, because a naive `ip saddr !=
        # @cloudflare drop` in forward would also match every container's
        # outbound HTTPS (Stripe/S3/SES) and reproduce the exact outage class
        # this file exists to end. Locking the origin down is tracked
        # separately via Cloudflare Authenticated Origin Pulls at the
        # application layer (Caddy client_auth). These rules become
        # effective the moment anything listens on 80/443 as a host process.
        ip  saddr @cloudflare_v4 tcp dport { 80, 443 } accept
        ip6 saddr @cloudflare_v6 tcp dport { 80, 443 } accept

        ip saddr 89.116.27.21 udp dport 51820 accept
        iifname "wg0" accept

        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept        # mandatory: NDP, or v6 breaks

        ct state invalid drop
    }

    chain forward {
        type filter hook forward priority 0; policy accept;
    }
}
